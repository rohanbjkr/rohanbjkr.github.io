---
layout: default
permalink: /revenue/
title: "Revenue Login"
---

<div class="revenue-login-page">

  <div class="revenue-login-card">

    <div class="revenue-login-header">
      <h1>Revenue Tracking System</h1>
      <p>Government Revenue Dashboard</p>
    </div>

    <form id="login-form">

      <div class="revenue-form-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
          autocomplete="username"
        >

      </div>


      <div class="revenue-form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
          >

          <button
            type="button"
            id="toggle-password"
            class="password-toggle"
          >
            Show
          </button>

        </div>

      </div>


      <button
        type="submit"
        id="login-button"
        class="revenue-login-button"
      >
        Sign In
      </button>


      <div
        id="login-message"
        class="login-message">
      </div>

    </form>

  </div>

</div>


<script src="{{ '/assets/js/revenue-auth.js' | relative_url }}"></script>
